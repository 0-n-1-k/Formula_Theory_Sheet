<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 // Route Not Found — BUET EEE Formula Sheet</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      --bg: #030305;
      --card: rgba(18, 19, 26, 0.94);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --muted: #98989d;
      --accent: #2997ff;
      --danger: #ff453a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px) 0 0 / 24px 24px,
        radial-gradient(circle at 20% 20%, rgba(41, 151, 255, 0.10), transparent 52%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .panel {
      width: min(520px, 100%);
      padding: 28px 24px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
    }
    .code {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.1em;
      color: var(--danger);
      background: rgba(255, 69, 58, 0.14);
      border: 1px solid rgba(255, 69, 58, 0.42);
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .path {
      display: block;
      padding: 9px 11px;
      margin-bottom: 18px;
      border-radius: 8px;
      background: #07080c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #64d2ff;
      word-break: break-all;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    a, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.06em;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.12s ease;
    }
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .primary {
      background: rgba(41, 151, 255, 0.2);
      border: 1px solid var(--accent);
      color: #fff;
    }
    .primary:hover {
      background: rgba(41, 151, 255, 0.3);
    }
    .secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.24);
    }
    a:active, button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <main class="panel" role="main">
    <div class="code">[:: HTTP 404 // ROUTE NOT FOUND ::]</div>
    <h1>Signal lost — this route does not exist.</h1>
    <p>The page or resource you requested is not in this term archive. Check the URL or return to the active workspace.</p>
    <code class="path" id="badPath">/404</code>
    <div class="actions">
      <a class="primary" href="/">[RETURN TO FORMULAS]</a>
      <button class="secondary" type="button" onclick="if (history.length > 1) { history.back(); } else { location.href = '/'; }">[GO BACK]</button>
    </div>
  </main>
  <script>
    (function () {
      var el = document.getElementById('badPath');
      if (el) {
        el.textContent = location.pathname + location.search + location.hash;
      }
    })();
  </script>
</body>
</html>
